; Gyro4All profile: Daemon X Machina (Unreal Engine 4.20, DX11, Steam). File name = game exe name without ".exe".
; See MODLOG.md (2026-11-01).
;
; Camera: the generic ControlRotation path turns both the on-foot character (OuterCharacter_C) and the Arsenal
; (ArsenalCharacter_C); no view section is needed.
;
; Sniper scope: the game keeps its own flag for the scope view, SniperModeEnabled, on the Arsenal's movement component
; (Pawn.ArsenalMovement, a TWeakObjectPtr<UTTLArsenalMovementComponent>). The ADS sensitivity profile follows that flag
; instead of a button (Mode=Game), so it switches only in the real scope: not when L3 is pressed with another weapon,
; and never out of step with the game. The on-foot character has no ArsenalMovement: the profile simply stays off
; there (logged once). The scope's own zoom (SniperCameraFieldOfViewRate 2x..6x) narrows the camera's FOV, which
; GyroLib's zoom compensation follows when turned on in the Sniper tab.
;
; Flight: the Arsenal hovers, boosts and glides with its CharacterMovement in MOVE_Flying, which Gyro4All otherwise
; takes for a scripted scene and pauses the gyro in (the stick kept working, the gyro stopped at every take-off).
; PauseWhenFlying=0 keeps the gyro on in the air; the game has no cutscene flag this would mask.
;
; Controller: the game only reads XInput 1.3; Gyro4All shows a DualSense / Switch Pro as an Xbox controller by itself.

[Gyro4All]
PauseWhenFlying=0
AdsProfileMode=Game
AdsProfileCondition=Pawn.ArsenalMovement.SniperModeEnabled
AdsProfileLabel=Sniper
