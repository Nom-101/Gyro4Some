; Gyro4All profile: Ghostwire: Tokyo (Unreal Engine 4.27.2, DX12, Steam). File name = game exe name without ".exe"
; (Snowfall\Binaries\Win64\GWT.exe). See MODLOG.md (2026-11-01).
;
; Camera: the generic ControlRotation path works on foot, but gyro yaw during gliding remains unresolved.
; RotationInput was tested: UpdateRotation hook discovery found no matching function, so it is not enabled.
;
; Controller: the game's own PlayStation support (HID, Sony's pad library) only knows the DualShock 4: it opens a
; DualSense every ~500 ms and closes it unread. Shown as a DualShock 4 the DualSense is read natively (PS prompts).
;
; Aim tabs: the game has no reflected aim flag reachable from the pawn, controller or camera manager (searched 4 hops
; deep), but the pawn's camera component, SnfPlayerCamera, zooms by a fixed amount: FieldOfView 90 unaimed, 75 in the
; ethereal-weaving aim (L2), 55 aiming / drawing the bow. The game has no FOV setting, so 90 is always the base.
; Aim follows the weaving zoom (< 85); Bow (< 65) turns on later in the same zoom and so wins while the bow is up (the
; most recently started profile has priority). While zooming in or out the other tab holds for a fraction of a second.

[Gyro4All]
; Keep gyro enabled in MOVE_Flying during player flight; normal pause checks still apply.
PauseWhenFlying=0
DualSenseAsDualShock4=1
AdsProfileMode=Game
AdsProfileCondition=Pawn.SnfPlayerCamera.FieldOfView < 85
AdsProfileLabel=Aim
AltAdsProfileMode=Game
AltAdsProfileCondition=Pawn.SnfPlayerCamera.FieldOfView < 65
AltAdsProfileLabel=Bow
